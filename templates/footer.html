{% load i18n %}
<footer class="ig-footer">
    <div class="ig-footer__inner">
        <nav class="ig-footer__links" aria-label="Footer">
            <a href="/contact">Contact</a>
            <a href="{% url 'blog:blog_feed' %}">{% trans 'Feed' %}</a>
            <a href="{% url 'polls:index' %}">{% trans 'Polls' %}</a>
        </nav>
        <form class="ig-lang" action="{% url 'set_language' %}" method="post">
            {% csrf_token %}
            <input name="next" type="hidden" value="{{ request.path }}">
            <label class="sr-only" for="language">Language</label>
            <select id="language" name="language" onchange="this.form.submit()">
                {% get_current_language as LANGUAGE_CODE %}
                {% get_available_languages as LANGUAGES %}
                {% get_language_info_list for LANGUAGES as languages %}
                {% for language in languages %}
                    <option value="{{ language.code }}"{% if language.code == LANGUAGE_CODE %} selected{% endif %}>
                        {{ language.name_local }}
                    </option>
                {% endfor %}
            </select>
        </form>
        <p class="ig-footer__copy">© {% now "Y" %} Song's Lab</p>
    </div>
</footer>
