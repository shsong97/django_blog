{% load static %}
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{% block title %}Song's Lab{% endblock %}</title>
    {% include "header.html" %}
    {% block external %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% include "menu.html" %}
    <main class="ig-shell">
        {% block body_area %}{% endblock %}
    </main>
    {% include "footer.html" %}
    <script src="{% static 'main/app.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
